name: niu-codex-npm-release

# Builds the release artifacts for the @unixwin/codex npm packages from a pinned
# commit, using upstream's own package builder so the layout matches
# codex-rs/scripts/codex_package/layout.py exactly.
#
# Why CI and not a local build: the version string is compiled in
# (CARGO_PKG_VERSION), so npm metadata and `codex --version` only agree if the
# binaries are built from the same revision that carries the bumped
# [workspace.package].version. Building 300 MB of Rust locally makes that easy
# to get wrong.
#
# Caching: the codex-cli release build is ~59 minutes cold on a windows-latest
# runner. The cargo home and the compiled dependency artifacts under
# `codex-rs/target/release` are restored with actions/cache and saved explicitly
# with `if: always()`, because actions/cache's own post step only saves on job
# success and the package/verify/publish steps at the end of this job fail on
# their own. Do not cache `target/` as a whole: only the release dependency
# directories are used, and a whole-target entry competes with the Bazel caches
# for the same 10 GB repo budget.
#
# Publish order matters. The meta package ships only bin/codex.js; its binaries
# arrive through optionalDependencies as `npm:@unixwin/codex@<version>-win32-x64`.
# Publish the platform package first, or the meta package installs into a
# "missing optional dependency" error.
#
# Setup: the repository needs two secrets before running with publish=true.
#   NPM_TOKEN         - an npm automation token with publish rights on the
#                       @unixwin scope (the org exists; the token must be able
#                       to publish there).
#   WPM_SOURCE_TOKEN  - a token with `repo` on unixwin/wpm-source, used to open
#                       and merge the index pull request. Without it the index
#                       step warns and skips, and `wpm install codex` keeps
#                       pointing at the previous release.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (requires the NPM_TOKEN secret)"
        type: boolean
        default: false
      npm_tag:
        description: "dist-tag for the meta package"
        type: string
        default: "latest"

# `contents: write` is what lets the release step attach the package zip
# and update the release; the default token is read-only, which failed
# the first publish run.
permissions:
  contents: write

jobs:
  release:
    name: Build, package, and optionally publish
    runs-on: windows-latest
    timeout-minutes: 360
    # A cold build occupies a runner for about an hour. Never run two release
    # builds at once: they compete for the same cache entries and can publish
    # the same version twice.
    concurrency:
      group: niu-codex-npm-release
      cancel-in-progress: false
    env:
      # Incremental artifacts are useless across CI jobs and only inflate the cache.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      # Cache keys cover what changes the *dependency* build: the lockfile, the
      # toolchain and the rustflags in .cargo/config.toml. Source changes must not
      # be part of the key, so that a new commit still hits this cache -- cargo's
      # own fingerprints decide what to rebuild from it.
      - name: Compute cache key
        id: cachekey
        shell: bash
        run: |
          set -euo pipefail
          echo "hash=$(cat codex-rs/Cargo.lock codex-rs/rust-toolchain.toml codex-rs/.cargo/config.toml | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo home cache
        id: cargo_home_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-windows-x64-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            cargo-home-windows-x64-

      # Cache the compiled dependency artifacts directly. Read the two exclusions
      # before adding paths:
      #
      # - Do NOT cache target/release/build. Restoring a build script's OUT_DIR
      #   alongside a fresh checkout left the v8 crate unable to find its
      #   `rusty_v8` static library, and the whole build died at the link
      #   (run 39022901124). Build scripts are cheap; let them re-run.
      # - Do NOT wrap rustc with sccache. It was measurably worse: sccache hashes
      #   the whole thin-LTO input set and stores the ~300 MB codex-cli output,
      #   so its overhead lands on the longest single step (measured 2026-10-17:
      #   115+ minutes unfinished against 68 minutes without it).
      #
      # The key carries a version so a cache written by an earlier set of paths
      # can never be restored.
      - name: Restore build cache
        id: build_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            codex-rs/target/release/deps
            codex-rs/target/release/.fingerprint
          key: build-windows-x64-v2-${{ steps.cachekey.outputs.hash }}
          restore-keys: |
            build-windows-x64-v2-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Read and guard the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' codex-rs/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml version: $version"
          # 0.0.0 is DEV_BUILD_VERSION_SENTINEL in windows-sandbox-rs: it selects a
          # mtime-based helper suffix and marks an unreleased tree. Refuse to ship it.
          if [ "$version" = "0.0.0" ]; then
            echo "::error::codex-rs/Cargo.toml still carries the 0.0.0 dev sentinel. Bump it in the release commit."
            exit 1
          fi

      # v8's build script creates a directory symlink under target/, which needs
      # Developer Mode or an elevated shell on Windows, and would otherwise run a
      # binding generator that wants libclang. Upstream ships prebuilt v8 static
      # libraries and pre-generated bindings for each target; this in-repo action
      # downloads and checksums them and exports RUSTY_V8_ARCHIVE and
      # RUSTY_V8_SRC_BINDING_PATH, which skips both problems.
      - name: Configure prebuilt rusty_v8
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc

      # Build without --target so artifacts land in codex-rs/target/release,
      # which is where the package builder looks by default on this host.
      #
      # One cargo invocation for every binary, matching upstream's
      # rust-release-windows.yml. Three separate invocations re-unified features
      # per call, so shared crates were compiled two or three times (~10 min of
      # the old 68-minute build step).
      # Three separate invocations, deliberately. Merging them into one was tried
      # and reverted: a single invocation unifies the feature sets of all three
      # packages, so shared dependencies rebuild with the union of those features
      # and the final codex-cli unit grows. Measured 2026-10-17: 82m07s merged
      # against 68m for the three separate builds.
      #
      # Each invocation overwrites target/cargo-timings/cargo-timing.html, so keep
      # a copy per invocation; the copies are uploaded for comparison.
      - name: Build the release binaries
        id: build
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          timings=target/cargo-timings
          cargo build --release --timings --package codex-cli --bin codex
          cp "$timings/cargo-timing.html" "$timings/timings-1-codex-cli.html"
          cargo build --release --timings --package codex-windows-sandbox --bins
          cp "$timings/cargo-timing.html" "$timings/timings-2-sandbox.html"
          cargo build --release --timings --package codex-code-mode-host --bin codex-code-mode-host
          cp "$timings/cargo-timing.html" "$timings/timings-3-code-mode-host.html"

      # --timings writes the per-unit breakdown to
      # target/cargo-timings/cargo-timing.html. The repo's own release workflow
      # uploads the same file, and it is the only way to separate compile time
      # from link time here without guessing. Costs one artifact.
      - name: Upload Cargo timings
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-niu-windows-x64
          # One copy per cargo invocation; cargo may write these under the target
          # triple directory, so glob for it.
          path: codex-rs/target/**/cargo-timings/*.html
          if-no-files-found: warn

      - name: Save cargo home cache
        if: always() && !cancelled() && steps.cargo_home_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-home-windows-x64-${{ steps.cachekey.outputs.hash }}

      # Save only after a successful build, and only on a miss. Saving a partial
      # dependency tree under the lockfile key would make it permanent: an exact
      # key can never be overwritten, so the cache would stay incomplete for the
      # life of that lockfile.
      - name: Save build cache
        if: always() && !cancelled() && steps.build.outcome == 'success' && steps.build_cache_restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            codex-rs/target/release/deps
            codex-rs/target/release/.fingerprint
          key: build-windows-x64-v2-${{ steps.cachekey.outputs.hash }}

      - name: Assemble the canonical package directory and the release zip
        id: assemble
        shell: bash
        run: |
          python scripts/build_codex_package.py \
            --target x86_64-pc-windows-msvc \
            --variant codex \
            --cargo-profile release \
            --package-dir "$RUNNER_TEMP/vendor/x86_64-pc-windows-msvc" \
            --archive-output "$RUNNER_TEMP/niu-codex-${{ steps.version.outputs.version }}-windows-x86_64.zip" \
            --entrypoint-bin "codex-rs/target/release/codex.exe" \
            --code-mode-host-bin "codex-rs/target/release/codex-code-mode-host.exe" \
            --codex-command-runner-bin "codex-rs/target/release/codex-command-runner.exe" \
            --codex-windows-sandbox-setup-bin "codex-rs/target/release/codex-windows-sandbox-setup.exe" \
            --force
          # --rg-bin is omitted on purpose: the builder fetches its pinned ripgrep.

      - name: Stage and verify the npm packages
        shell: bash
        run: |
          sh scripts/niu/verify-npm-package.sh \
            "${{ steps.version.outputs.version }}" \
            "$RUNNER_TEMP/vendor" \
            "$RUNNER_TEMP/npm"

      # Runs even when verification fails: the packaged zip is the expensive
      # part of this job and must stay downloadable for inspection or for a
      # publish that is retried without a rebuild. Guarded on the assemble step
      # rather than the build step so a failed build does not report a
      # misleading "no files found" error here.
      - name: Upload artifacts
        if: always() && !cancelled() && steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: niu-codex-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/niu-codex-*.zip
            ${{ runner.temp }}/npm/*.tgz

      - name: Publish to npm
        if: ${{ inputs.publish }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          platform="$(ls "$RUNNER_TEMP"/npm/unixwin-codex-"$version"-win32-x64.tgz)"
          meta="$(ls "$RUNNER_TEMP"/npm/unixwin-codex-"$version".tgz)"
          # Platform first: the meta package depends on it.
          npm publish "$platform" --tag win32-x64 --access public
          npm publish "$meta" --tag "${{ inputs.npm_tag }}" --access public
          echo "published @unixwin/codex@$version (platform: win32-x64, meta tag: ${{ inputs.npm_tag }})"

      # The wpm index points at this asset, so it has to exist in a release -
      # workflow artifacts need auth and expire.
      - name: Attach the package zip to a release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: codex-v${{ steps.version.outputs.version }}
          name: "Codex ${{ steps.version.outputs.version }} (windows x64)"
          prerelease: true
          files: ${{ runner.temp }}/niu-codex-*.zip

      # Same shape as the WinuxCmd release: rewrite the package entry in
      # unixwin/wpm-source and let the PR merge itself. Warnings, not failures,
      # when the token is absent - a missing index update must not invalidate an
      # otherwise good npm release.
      - name: Update the WPM package index
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WPM_SOURCE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WPM_SOURCE_TOKEN is not configured; the wpm index keeps pointing at the previous release"
            exit 0
          fi
          zip="$(ls "$RUNNER_TEMP"/niu-codex-"$VERSION"-windows-x86_64.zip)"
          rm -rf "$RUNNER_TEMP/wpm-source"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/unixwin/wpm-source.git" "$RUNNER_TEMP/wpm-source"
          pwsh -NoProfile -File scripts/niu/update-wpm-index.ps1 \
            -IndexPath "$RUNNER_TEMP/wpm-source/index.json" \
            -Version "$VERSION" \
            -ZipPath "$zip" \
            -ReleaseTag "codex-v${VERSION}"
          cd "$RUNNER_TEMP/wpm-source"
          if git diff --quiet -- index.json; then
            echo "wpm index already matches codex ${VERSION}."
            exit 0
          fi
          branch="automation/codex-${VERSION}-index"
          title="index: codex ${VERSION}"
          body="Automated update from unixwin/codex ${VERSION} (asset: $(basename "$zip"))."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add index.json
          git commit -m "$title"
          git push --force-with-lease origin "$branch"
          pr_url="$(gh pr list --repo unixwin/wpm-source --head "$branch" --state open --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create --repo unixwin/wpm-source --base main --head "$branch" --title "$title" --body "$body")"
          fi
          gh pr merge "$pr_url" --repo unixwin/wpm-source --squash --delete-branch ||
            gh pr merge "$pr_url" --repo unixwin/wpm-source --squash --delete-branch --auto
